[package]
name = "rusted-mic"
description = "Rusted Mic: the game window and command-line frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "RustedMic"
path = "src/main.rs"

[features]
default = ["importer", "dialog"]
# First-boot detection / validation / import. Disable with
# `--no-default-features` to remove the importer entirely; you then pass an
# asset folder with `--assets <dir>`.
importer = ["dep:funkin-assets"]
# Native Windows folder picker for setup.
dialog = ["importer", "dep:rfd"]

[dependencies]
funkin-core = { path = "../funkin-core" }
funkin-script = { path = "../funkin-script" }
funkin-assets = { path = "../funkin-assets", optional = true }
rfd = { version = "0.14", optional = true }
log.workspace = true
env_logger = "0.11"
winit = "0.30.13"
wgpu = { version = "30.0.2", features = ["glsl"] }
regex = "1.13.2"
pollster = "1.0.3"
cpal = "0.18.2"
lewton = "0.10.2"
fontdue = "0.9"
ttf-parser = "0.25"
bytemuck = { version = "1.25.2", features = ["derive"] }
serde_json.workspace = true
dirs.workspace = true
serde.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
openh264 = "0.9.10"
mp4 = "0.14.0"
matroska-demuxer = "0.8.1"
rusty_vp9 = "0.3.0"
de265-sys = { path = "../de265-sys" }
symphonia = { version = "0.5.4", default-features = false, features = ["aac"] }
gilrs = "0.11.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
