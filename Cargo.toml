[workspace]
resolver = "2"
members = ["crates/funkin-core", "crates/funkin-assets", "crates/funkin-game"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
semver = "1"
dirs = "5"
log = "0.4"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
